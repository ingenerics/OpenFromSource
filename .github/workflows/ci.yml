name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (python 3.13, gpg/gpgv, apt build tools)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-pip python3-setuptools gnupg dpkg-dev binutils
          python3 -m pip install --upgrade pip

      - name: Install project and dev tooling
        run: pip install -e ".[dev]"

      - name: Run test suite (pytest)
        run: python3 -m pytest tests/ -v

      - name: Run test suite (unittest)
        run: python3 -m unittest discover -s tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install "ruff>=0.9,<0.12"

      - name: Run ruff
        run: ruff check src/ tests/
