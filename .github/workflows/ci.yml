name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite (pytest)
        run: pytest tests/ -v

      # The suite must stay green under BOTH documented runners:
      # a green pytest alone can miss a runner-specific regression,
      # so the unittest leg is enforced in CI, not just documented.
      - name: Run test suite (unittest)
        run: python -m unittest discover -s tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install "ruff>=0.9,<0.12"

      - name: Run ruff
        run: ruff check src/ tests/
